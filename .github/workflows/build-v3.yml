name: Build FULK Android V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V3
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q FULK_ANDROID_NATIVE_V3.zip -d android-project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK V3
        working-directory: android-project/fulk-android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FULK-V3-debug-apk
          path: android-project/fulk-android/app/build/outputs/apk/debug/app-debug.apk
