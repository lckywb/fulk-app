name: Build FULK Android

on:
  workflow_dispatch:
  push:
    branches:
      - utama
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find FULK ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'FULK_ANDROID_*.zip' -type f | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "FULK Android ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q "$ZIP_FILE" -d android-project
          echo "Isi hasil extract:"
          find android-project -maxdepth 3 -type f | sort | head -100

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-project/fulk-android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FULK-debug-apk
          path: android-project/fulk-android/app/build/outputs/apk/debug/app-debug.apk
